name: BWTDallas CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  deterministic-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check server syntax
        run: node --check server.js

      - name: Validate shared CSS foundation
        run: npm run validate:shared-css

      - name: Run deterministic core tests
        run: |
          node --test \
            config/unitFormFieldRegistry.test.js \
            services/lotUnitFormProfileResolver.test.js \
            services/hardwareCapacity.test.js \
            services/unitExportService.test.js
